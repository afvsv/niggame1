<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Иголка в стоге</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="labels"></div>
      <div id="fps" class="hidden"></div>
      <div id="crosshair"></div>
      <div id="objective">
        <div class="obj-head"><span id="obj-title"></span><span id="obj-count"></span></div>
        <div id="obj-goal"></div>
        <div id="obj-pips"></div>
        <div id="obj-step"><span id="obj-step-n"></span><span id="obj-step-text"></span></div>
      </div>
      <div id="hud-top-right">
        <div id="hud-dev" class="hidden">DEV</div>
        <div id="hud-money">$0.00</div>
        <div id="hud-hay"></div>
        <div id="hud-pops"></div>
      </div>
      <div id="hud-hint"></div>
      <div id="toast" class="hidden">
        <div id="toast-kicker"></div>
        <div id="toast-title"></div>
        <div id="toast-text"></div>
      </div>
      <div id="hud-bottom">
        <div id="signal" class="hidden"><span id="signal-label"></span><span id="signal-bars"><i></i><i></i><i></i><i></i><i></i></span></div>
        <div id="held"><span id="held-name"></span><span id="held-load"></span></div>
        <div id="hotbar"></div>
        <div id="hud-keys"><kbd>Tab</kbd><span id="hud-tree-label"></span><b id="hud-tree-new"></b></div>
      </div>
      <div id="stamina"><span id="stamina-label"></span><div class="bar"><i></i></div></div>
    </div>
    <div id="shop" class="screen hidden" role="dialog" aria-labelledby="shop-title">
      <div class="panel">
        <header>
          <div>
            <h2 id="shop-title"></h2>
            <p id="shop-subtitle"></p>
          </div>
          <div class="wallet"><span id="shop-wallet-label"></span><b id="shop-money"></b></div>
        </header>
        <ul id="shop-list"></ul>
        <footer><span id="shop-count"></span><span id="shop-keys"></span><button id="shop-close" class="btn" type="button"></button></footer>
      </div>
    </div>
    <div id="build" class="screen hidden" role="dialog" aria-labelledby="build-title">
      <div class="panel build-panel">
        <header class="head">
          <div>
            <h2 id="build-title"></h2>
            <p id="build-subtitle"></p>
          </div>
          <div class="wallet"><span id="build-wallet-label"></span><b id="build-money"></b></div>
        </header>
        <ul id="build-list"></ul>
        <footer><span id="build-hint"></span><span id="build-keys"></span><button id="build-close" class="btn" type="button"></button></footer>
      </div>
    </div>
    <div id="tree" class="screen hidden" role="dialog" aria-labelledby="tree-title">
      <div class="tree-shell">
        <header class="tree-head">
          <h2 id="tree-title"></h2>
          <input id="tree-search" type="search" autocomplete="off" spellcheck="false">
          <b id="tree-money"></b>
        </header>
        <div class="tree-main">
          <aside id="tree-side">
            <div id="tree-branch-now"></div>
            <ul id="tree-branches"></ul>
          </aside>
          <div id="tree-view">
            <div id="tree-steps"></div>
            <div id="tree-canvas"></div>
          </div>
          <section id="tree-detail"></section>
        </div>
        <footer id="tree-foot"></footer>
      </div>
    </div>
    <div id="bench" class="hidden" role="status">
      <div id="bench-kicker"></div>
      <div id="bench-title"></div>
      <div id="bench-text"></div>
      <div class="bar"><i></i></div>
    </div>
    <div id="overlay">
      <div class="overlay-card">
        <h1 id="overlay-title"></h1>
        <p id="overlay-text"></p>
        <ul id="overlay-controls"></ul>
        <div id="overlay-actions" class="hidden">
          <button id="overlay-settings" class="btn" type="button"></button>
          <button id="overlay-reset" type="button"></button>
        </div>
      </div>
    </div>
    <div id="settings" class="screen hidden" role="dialog" aria-labelledby="settings-title">
      <div class="panel settings-panel">
        <header>
          <div>
            <h2 id="settings-title"></h2>
            <p id="settings-subtitle"></p>
          </div>
        </header>
        <div id="settings-body"></div>
        <footer>
          <span id="settings-note"></span>
          <span class="settings-actions">
            <button id="settings-defaults" class="btn ghost" type="button"></button>
            <button id="settings-reload" class="btn hidden" type="button"></button>
            <button id="settings-close" class="btn" type="button"></button>
          </span>
        </footer>
      </div>
    </div>
    <div id="ending" class="screen hidden" role="dialog" aria-labelledby="ending-title">
      <div class="panel ending-panel">
        <header><div><h2 id="ending-title"></h2><p id="ending-subtitle"></p></div></header>
        <dl id="ending-stats"></dl>
        <footer>
          <span id="ending-note"></span>
          <span class="settings-actions">
            <button id="ending-stay" class="btn ghost" type="button"></button>
            <button id="ending-new" class="btn" type="button"></button>
          </span>
        </footer>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
