<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Иголка в стоге</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="crosshair"></div>
      <div id="hud-top-right">
        <div id="hud-money">$0.00</div>
        <div id="hud-hay"></div>
        <div id="hud-pops"></div>
      </div>
      <div id="hud-hint"></div>
      <div id="hud-bottom">
        <div id="hotbar-name"></div>
        <div id="carry">
          <div class="carry-label"><span id="carry-name"></span><span id="carry-num"></span></div>
          <div class="carry-bar"><div id="carry-fill"></div></div>
        </div>
        <div id="hotbar"></div>
      </div>
    </div>
    <div id="shop" class="screen hidden" role="dialog" aria-labelledby="shop-title">
      <div class="panel">
        <header>
          <div>
            <h2 id="shop-title"></h2>
            <p id="shop-subtitle"></p>
          </div>
          <div class="wallet"><span id="shop-wallet-label"></span><b id="shop-money"></b></div>
        </header>
        <ul id="shop-list"></ul>
        <footer><button id="shop-close" class="btn ghost" type="button"></button></footer>
      </div>
    </div>
    <div id="overlay">
      <div class="overlay-card">
        <h1 id="overlay-title"></h1>
        <p id="overlay-text"></p>
        <ul id="overlay-controls"></ul>
        <button id="overlay-reset" type="button"></button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
